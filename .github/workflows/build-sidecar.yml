name: Build public Harbor sidecar

"on":
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      BUILDX_METADATA_PROVENANCE: max
    steps:
      - name: Checkout public build package
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify original context SHA256 before build
        run: |
          set -eu
          mkdir provenance
          set +e
          sha256sum -c MANIFEST.sha256 >provenance/checksums.stdout.log 2>provenance/checksums.stderr.log
          producer_rc=$?
          printf '%s\n' "$producer_rc" >provenance/checksums.exit_code.txt
          cat provenance/checksums.stdout.log
          cat provenance/checksums.stderr.log >&2
          exit "$producer_rc"
      - name: Verify provenance, build, inspect and save fixed sidecar
        run: python3 -B scripts/build_sidecar.py
      - name: Upload image archive and provenance including failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harbor-sidecar-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: provenance/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
